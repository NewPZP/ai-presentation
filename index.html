<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 · 阿票</title>
<!--
  个人主页
  结构：上方个人信息 banner + 下方「画廊 + 按入口筛选」作品墙。
  数据来源：
    - profile.js  —— 个人信息（banner / 社交入口 / 关于我 / 联系区 / 页脚）
    - courses.js  —— 作品墙（每门课程 = 一张卡片，可配 github / video 关联入口）
  功能：明暗模式切换（右上角）、按入口筛选、教程入口弹窗（打开课程目录）。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #c17f59; }
  /* ---- 暗黑模式 ---- */
  html[data-theme="dark"] {
    --bg: #0f1215; --bg2: #14181c; --ink: #f2efe9; --muted: #9aa2ab; --line: #24282d;
    --card: #171b1f; --banner-glow: rgba(193,127,89,0.28);
    --btn-bg: #fff; --btn-ink: #0f1215;
    --shadow: rgba(0,0,0,0.4);
    --filter-bg: #0f1215;
  }
  /* ---- 明亮模式 ---- */
  html[data-theme="light"] {
    --bg: #f7f4ef; --bg2: #fdfbf7; --ink: #211b15; --muted: #7d7368; --line: #e7e0d6;
    --card: #ffffff; --banner-glow: rgba(193,127,89,0.16);
    --btn-bg: #211b15; --btn-ink: #fff;
    --shadow: rgba(33,27,21,0.14);
    --filter-bg: #f7f4ef;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--ink);
    transition: background 0.3s, color 0.3s;
  }
  a { color: inherit; }
  button { font-family: inherit; }

  /* ============ 卡片底部合并区：左入口图标 + 右亮点标签 ============ */
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--card); }
  .foot-entries { display: flex; align-items: center; gap: 10px; }
  .entry-icon { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; text-decoration: none; transition: transform 0.2s, opacity 0.2s; }
  .entry-icon:hover { transform: translateY(-2px); opacity: 0.9; }
  .entry-icon svg { width: 15px; height: 15px; }
  .entry-icon.e-tutorial { background: #1e3a8a; }
  .entry-icon.e-tutorial:hover { background: #0ea5e9; }
  .entry-icon.e-tutorial::after { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: #ffd58a; border: 1.5px solid var(--card); }
  .entry-icon.e-github { background: #24292f; }
  .entry-icon.e-github:hover { background: #0d1117; }
  .entry-icon.e-video { background: #7f1d1d; }
  .entry-icon.e-video:hover { background: #ef4444; }
  .entry-icon.e-soon { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .foot-highlights { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* ============ 明暗模式开关 ============ */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 1500;
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 8px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    box-shadow: 0 8px 24px -12px var(--shadow);
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .ic { display: inline-flex; }
  .theme-toggle .ic svg { width: 16px; height: 16px; }
  html[data-theme="dark"]  .ic-sun  { display: inline-flex; }
  html[data-theme="dark"]  .ic-moon { display: none; }
  html[data-theme="light"] .ic-sun  { display: none; }
  html[data-theme="light"] .ic-moon { display: inline-flex; }

  /* ============ 顶部 banner（个人信息） ============ */
  .banner {
    padding: 88px 28px 52px; text-align: center;
    background: radial-gradient(1100px 460px at 50% -12%, var(--banner-glow), transparent 62%), linear-gradient(180deg, var(--bg2), var(--bg));
  }
  .banner .avatar { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 20px; background: linear-gradient(135deg, var(--accent), #e2a97f); color: #fff; font-size: 2.1rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .banner h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.03em; line-height: 1.05; }
  .banner .pos { color: var(--accent); font-weight: 600; margin-top: 8px; }
  .banner .intro { color: var(--muted); max-width: 560px; margin: 14px auto 0; }
  .banner .socials { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .banner .socials a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--muted);
    text-decoration: none; transition: color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .banner .socials a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
  .banner .socials a svg { width: 16px; height: 16px; }

  /* ============ 筛选条 ============ */
  .filterbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 22px 0 6px; position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, var(--filter-bg) 72%, transparent); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; font-size: 0.86rem; font-weight: 600; cursor: pointer; }
  .chip .chip-ic { display: inline-flex; }
  .chip .chip-ic svg { width: 14px; height: 14px; }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* ============ 作品网格 ============ */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 1180px; margin: 0 auto; padding: 22px 28px 80px; }
  .card { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line); transition: transform 0.2s, border-color 0.2s; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .cover { display: flex; flex-direction: column; justify-content: flex-end; text-decoration: none; color: #fff; padding: 46px 18px 18px; position: relative; min-height: 170px; flex: 1; }
  .cover .status-badge { position: absolute; top: 14px; left: 14px; font-size: 0.7rem; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,0.32); color: #fff; }
  .cover h3 { font-size: 1.15rem; font-weight: 700; line-height: 1.25; text-shadow: 0 1px 8px rgba(0,0,0,0.25); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cover p { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ============ 预告（即将上线）卡片：斜纹背景区分已完结 ============ */
  .card.upcoming { border-style: dashed; border-color: var(--muted); }
  .cover.upcoming {
    background: repeating-linear-gradient(135deg, var(--card), var(--card) 14px, var(--bg2) 14px, var(--bg2) 28px);
    color: var(--ink);
  }
  .cover.upcoming h3 { color: var(--ink); text-shadow: none; }
  .cover.upcoming p { color: var(--muted); }
  .status-badge.upcoming { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.55); color: #ffd58a; }
  .status-badge.upcoming .dot { width: 6px; height: 6px; border-radius: 50%; background: #ffd58a; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .soon-date { margin-top: 10px; font-size: 0.78rem; color: var(--muted); font-weight: 600; }

  /* ============ 作者亮点标签（抓眼球，位于合并区右侧） ============ */
  .highlight { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.02em; color: #fff; background: linear-gradient(135deg, #d97706, #f59e0b); }
  .highlight svg { width: 11px; height: 11px; }

  /* ============ 关于 / 联系 / 页脚 ============ */
  .about { max-width: 760px; margin: 0 auto; padding: 40px 28px 56px; border-top: 1px solid var(--line); }
  .about h2 { font-size: 1.5rem; margin-bottom: 14px; }
  .about p { color: var(--muted); margin-bottom: 12px; }
  .contact { padding: 40px 28px 64px; text-align: center; }
  .contact h2 { font-size: 1.8rem; margin-bottom: 8px; }
  .contact p { color: var(--muted); margin-bottom: 22px; }
  .btn { display: inline-flex; padding: 12px 24px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-ink); font-weight: 700; text-decoration: none; font-size: 0.9rem; }
  .btn:hover { opacity: 0.88; }
  .footer { padding: 28px 28px 44px; text-align: center; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--line); }

  /* ============ 弹窗（教程入口，恒为浅色便于阅读） ============ */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,17,19,0.6); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; color: #241d15; border-radius: 16px; width: 100%; max-width: 560px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
  .modal-header { padding: 22px 26px; border-bottom: 1px solid #eee6db; display: flex; justify-content: space-between; gap: 16px; }
  .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 2px; }
  .modal-sub { font-size: 0.8rem; color: #8a7f73; }
  .modal-close { width: 32px; height: 32px; border: 1px solid #e5ddd2; border-radius: 8px; background: transparent; cursor: pointer; font-size: 1rem; color: #8a7f73; }
  .modal-close:hover { border-color: #c17f59; color: #c17f59; }
  .modal-body { padding: 22px 26px; overflow-y: auto; flex: 1; }
  .modal-search { width: 100%; padding: 10px 14px; font-size: 0.85rem; border: 1px solid #e5ddd2; border-radius: 8px; outline: none; margin-bottom: 18px; font-family: inherit; }
  .modal-search:focus { border-color: #c17f59; }
  .stage { margin-bottom: 20px; }
  .stage-name { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #c17f59; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #eee6db; }
  .lessons { list-style: none; }
  .lessons li { display: flex; gap: 12px; align-items: baseline; padding: 6px 8px; border-radius: 6px; font-size: 0.88rem; }
  .lessons li:hover { background: #faf6f0; }
  .lessons .n { color: #b3a89b; font-variant-numeric: tabular-nums; min-width: 22px; font-size: 0.76rem; }
  .lessons a { text-decoration: none; flex: 1; color: #241d15; }
  .lessons a:hover { color: #c17f59; }
  .no-results { text-align: center; color: #b3a89b; padding: 40px 0; font-size: 0.9rem; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- 明暗模式开关 -->
<button id="themeToggle" class="theme-toggle" aria-label="切换明暗模式">
  <span class="ic ic-sun"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
  <span class="ic ic-moon"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
  <span id="themeText">明亮</span>
</button>

<!-- 顶部：个人信息 -->
<header class="banner">
  <div class="avatar" data-profile="nameInitial"></div>
  <h1 data-profile="name"></h1>
  <div class="socials" data-profile-socials></div>
  <div class="pos" data-profile="position"></div>
  <p class="intro" data-profile="heroDesc"></p>
</header>

<!-- 筛选条 -->
<div class="filterbar" data-filter-bar="grid">
  <button class="chip active" data-filter="all">全部</button>
  <button class="chip" data-filter="tutorial">有教程</button>
  <button class="chip" data-filter="github">有源码</button>
  <button class="chip" data-filter="video">有视频</button>
</div>

<!-- 作品墙 -->
<div class="grid" id="grid"></div>

<!-- 关于 / 联系 / 页脚 -->
<section class="about">
  <h2>关于我</h2>
  <div data-profile-about></div>
</section>
<section class="contact">
  <h2 data-profile="contact.title"></h2>
  <p data-profile="contact.desc"></p>
  <a class="btn" href="mailto:hello@example.com" data-profile-email>发送邮件</a>
</section>
<footer class="footer" data-profile="footer"></footer>

<!-- 弹窗（教程入口） -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" class="modal-search" id="modalSearch" placeholder="在课程内搜索...">
      <div id="modalChapters"></div>
    </div>
  </div>
</div>

<script src="courses.js"></script>
<script src="profile.js"></script>
<script>
  // ============ 图标 ============
  var BOOK_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  var GITHUB_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var MAIL_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>';
  var TV_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><path d="M17 2l-5 5-5-5"/></svg>';
  var STAR_SVG = '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>';
  var CLOCK_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

  // 社交链接小图标：按 profile.js 里的 label 匹配图标
  function socialIcon(label) {
    var k = String(label || '').toLowerCase();
    if (k.indexOf('github') > -1) return GITHUB_SVG;
    if (k.indexOf('bili') > -1) return TV_SVG;
    if (k.indexOf('mail') > -1 || k.indexOf('email') > -1) return MAIL_SVG;
    return MAIL_SVG;
  }

  // ============ 作品墙数据：由 courses.js 的 COURSES 派生 ============
  // 每门课程 = 一张卡片；教程入口 = 课程本身（默认），github / video 为可选关联入口。
  function isUpcoming(c) { return /预告|筹备|即将/i.test(c.status || ''); }
  function hasLessons(c) { return !!(c.stages && c.stages.some(function (s) { return s.lessons && s.lessons.length; })); }

  var PROJECTS = COURSES.map(function (c, i) {
    var upcoming = isUpcoming(c);
    return {
      title: c.title, status: c.status, desc: c.desc, gradient: c.gradient,
      upcoming: upcoming,
      date: c.date || null,
      highlights: c.highlights || null,
      tutorial: (upcoming || !hasLessons(c)) ? null : i,
      github: c.github || null,
      video: c.video || null,
    };
  });
  // 预告项目排最前（其余保持 courses.js 原有顺序）
  PROJECTS.sort(function (a, b) { return (a.upcoming === b.upcoming) ? 0 : (a.upcoming ? -1 : 1); });

  // ============ 渲染 ============
  function coverAttrs(p) {
    if (p.tutorial != null) return 'href="#" data-tutorial="' + p.tutorial + '"';
    if (p.github) return 'href="' + p.github + '" target="_blank" rel="noopener"';
    if (p.video) return 'href="' + p.video + '" target="_blank" rel="noopener"';
    return 'href="#"';
  }
  function entryIcons(p) {
    var out = [];
    if (p.tutorial != null) out.push('<a class="entry-icon e-tutorial" href="#" data-tutorial="' + p.tutorial + '" title="教程（默认）" aria-label="教程（默认）">' + BOOK_SVG + '</a>');
    if (p.github) out.push('<a class="entry-icon e-github" href="' + p.github + '" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">' + GITHUB_SVG + '</a>');
    if (p.video) out.push('<a class="entry-icon e-video" href="' + p.video + '" target="_blank" rel="noopener" title="视频" aria-label="视频">' + PLAY_SVG + '</a>');
    return '<div class="foot-entries">' + out.join('') + '</div>';
  }

  // 作者亮点标签（抓眼球）
  function highlightsPills(p) {
    if (!p.highlights || !p.highlights.length) return '';
    var pills = p.highlights.map(function (t) { return '<span class="highlight">' + STAR_SVG + t + '</span>'; }).join('');
    return '<div class="foot-highlights">' + pills + '</div>';
  }

  // 合并区：左边入口图标，右边亮点标签
  function footHtml(p) {
    var left = p.upcoming
      ? '<span class="entry-icon e-soon" title="即将上线" aria-label="即将上线">' + CLOCK_SVG + '</span>'
      : entryIcons(p);
    return '<div class="card-foot">' + left + highlightsPills(p) + '</div>';
  }

  function cardHtml(p) {
    var data = 'data-has-tutorial="' + (p.tutorial != null) + '" data-has-github="' + (!!p.github) + '" data-has-video="' + (!!p.video) + '"';
    var body;
    if (p.upcoming) {
      body = '<div class="cover upcoming">'
        + '<span class="status-badge upcoming"><span class="dot"></span>' + p.status + '</span>'
        + '<h3>' + p.title + '</h3><p>' + p.desc + '</p>'
        + (p.date ? '<span class="soon-date">' + p.date + '</span>' : '')
        + '</div>'
        + footHtml(p);
    } else {
      body = '<a class="cover" ' + coverAttrs(p) + ' style="background:linear-gradient(150deg,' + p.gradient + ')">'
        + '<span class="status-badge">' + p.status + '</span>'
        + '<h3>' + p.title + '</h3><p>' + p.desc + '</p></a>' + footHtml(p);
    }
    return '<div class="card' + (p.upcoming ? ' upcoming' : '') + '" ' + data + '>' + body + '</div>';
  }
  document.getElementById('grid').innerHTML = PROJECTS.map(cardHtml).join('');

  // 给筛选按钮加图标（与卡片入口图标一致）
  var CHIP_ICONS = { tutorial: BOOK_SVG, github: GITHUB_SVG, video: PLAY_SVG };
  document.querySelectorAll('.filterbar .chip[data-filter]').forEach(function (btn) {
    var ic = CHIP_ICONS[btn.dataset.filter];
    if (ic) {
      var s = document.createElement('span');
      s.className = 'chip-ic';
      s.innerHTML = ic;
      btn.insertBefore(s, btn.firstChild);
    }
  });

  // ============ 按入口筛选 ============
  document.querySelectorAll('[data-filter-bar]').forEach(function (bar) {
    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-filter]');
      if (!btn) return;
      var f = btn.dataset.filter;
      bar.querySelectorAll('[data-filter]').forEach(function (b) { b.classList.toggle('active', b === btn); });
      document.getElementById(bar.dataset.filterBar).querySelectorAll('.card').forEach(function (card) {
        var show = (f === 'all') || (card.dataset['has' + f[0].toUpperCase() + f.slice(1)] === 'true');
        card.style.display = show ? '' : 'none';
      });
    });
  });

  // ============ 个人信息（来自 profile.js） ============
  function getProfileVal(key) {
    return key.split('.').reduce(function (o, k) { return (o == null ? o : o[k]); }, PROFILE);
  }
  document.querySelectorAll('[data-profile]').forEach(function (el) {
    var v = getProfileVal(el.dataset.profile); if (v != null) el.textContent = v;
  });
  document.querySelectorAll('[data-profile-email]').forEach(function (el) { el.href = 'mailto:' + PROFILE.email; });
  document.querySelectorAll('[data-profile-about]').forEach(function (c) { c.innerHTML = PROFILE.about.map(function (p) { return '<p>' + p + '</p>'; }).join(''); });
  document.querySelectorAll('[data-profile-socials]').forEach(function (c) {
    c.innerHTML = PROFILE.socials.map(function (s) {
      return '<a href="' + s.url + '" title="' + s.label + '" aria-label="' + s.label + '" target="_blank" rel="noopener">' + socialIcon(s.label) + '</a>';
    }).join('');
  });

  // ============ 教程入口弹窗 ============
  var overlay = document.getElementById('modalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var modalSub = document.getElementById('modalSub');
  var modalChapters = document.getElementById('modalChapters');
  var modalSearch = document.getElementById('modalSearch');
  var currentCourse = null;
  function totalLessons(c) { return c.stages.reduce(function (s, x) { return s + x.lessons.length; }, 0); }
  function chaptersHtml(c, q) {
    var html = c.stages.map(function (st) {
      var lessons = q ? st.lessons.filter(function (l) { return l.t.toLowerCase().indexOf(q) > -1; }) : st.lessons;
      if (q && !lessons.length) return '';
      return '<div class="stage"><div class="stage-name">' + st.name + '</div><ul class="lessons">'
        + lessons.map(function (l) { return '<li><span class="n">' + l.n + '</span><a href="' + c.path + '/lessons/' + l.f + '">' + l.t + '</a></li>'; }).join('')
        + '</ul></div>';
    }).join('');
    return html || '<div class="no-results">没有匹配的内容</div>';
  }
  function openModal(idx, q) {
    var c = COURSES[idx];
    currentCourse = c;
    modalTitle.textContent = c.title;
    modalSub.textContent = c.status + ' · 共 ' + totalLessons(c) + ' 课';
    modalSearch.value = q || '';
    modalChapters.innerHTML = chaptersHtml(c, q || '');
    overlay.classList.add('open');
    if (!q) setTimeout(function () { modalSearch.focus(); }, 60);
  }
  function closeModal() { overlay.classList.remove('open'); currentCourse = null; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tutorial]');
    if (t) { e.preventDefault(); openModal(Number(t.dataset.tutorial)); }
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  modalSearch.addEventListener('input', function (e) { if (currentCourse) modalChapters.innerHTML = chaptersHtml(currentCourse, e.target.value); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  // ============ 明暗模式开关 ============
  var THEME_KEY = 'homepage-theme';
  function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeText').textContent = (t === 'dark') ? '明亮' : '暗色';
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });
  (function () {
    var saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === 'light' ? 'light' : 'dark');
  })();
</script>

</body></html>
